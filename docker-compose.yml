version: '3.8'

services:
  # ==================================================
  # 1. PostgreSQL Database
  # ==================================================
  postgres:
    image: postgres:16-alpine
    container_name: pawconnect_postgres
    restart: always
    environment:
      POSTGRES_DB: pawconnect_db
      POSTGRES_USER: pawconnect_user
      POSTGRES_PASSWORD: pawconnect_prod_db_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawconnect_user -d pawconnect_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================================================
  # 2. Redis Cache & Session Store
  # ==================================================
  redis:
    image: redis:7-alpine
    container_name: pawconnect_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================================================
  # 3. FastAPI Backend
  # ==================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pawconnect_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://pawconnect_user:pawconnect_prod_db_password_2026@postgres:5432/pawconnect_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: pawconnect_prod_jwt_super_secret_key_2026
    ports:
      - "8000:8000"

  # ==================================================
  # 4. Public Web App (Port 3000)
  # ==================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pawconnect_frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"

  # ==================================================
  # 5. Admin Panel Web App (Port 3001)
  # ==================================================
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: pawconnect_admin
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3001:3001"

  # ==================================================
  # 6. Nginx Production Reverse Proxy
  # ==================================================
  nginx:
    image: nginx:alpine
    container_name: pawconnect_nginx
    restart: always
    depends_on:
      - backend
      - frontend
      - admin
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro

volumes:
  postgres_data:
  redis_data:
